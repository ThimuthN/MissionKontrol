<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8f5f3">
  <meta name="description" content="Mission Control reconstructs how work moved across Teams and Outlook, with evidence you can inspect.">
  <title>Mission Control | Process intelligence</title>
  <script src="/theme-init.js"></script>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/replay.css">
  <link rel="stylesheet" href="/account.css">
  <link rel="stylesheet" href="/case-sheet.css">
  <link rel="stylesheet" href="/paper-motion.css">
  <link rel="stylesheet" href="/review-updates.css">
  <link rel="stylesheet" href="/experience.css">
  <link rel="stylesheet" href="/refinement.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#case-lab">Skip to the casebook</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="welcome-button" class="brand" type="button" aria-label="Mission Control, choose a dataset"><span class="mark" aria-hidden="true"></span>Mission Control</button>
      <div class="top-actions">
        <span id="dataset" class="dataset">Assessment demo</span>
        <button id="open-assistant" class="nav-button" type="button" disabled>Ask the evidence</button>
        <button id="import-button" class="nav-button" type="button" disabled>Import ZIP</button>
        <details id="export-menu" class="export">
          <summary class="nav-button">Export <span class="chevron" aria-hidden="true"></span></summary>
          <div class="export-items">
            <button id="print-case" type="button" disabled>Print current case</button>
            <button id="export-csv" type="button" disabled>Case and stage CSV</button>
            <button id="export-json" type="button" disabled>Evidence and reviews JSON</button>
          </div>
        </details>
      </div>
      <input id="import-file" type="file" accept=".zip,application/zip" hidden>
    </div>
  </header>
  <main>
    <section class="scene-frame" aria-label="Workflow overview">
      <nav id="process-switch" class="process-switch" aria-label="Switch workflow process" hidden></nav>
      <section class="intro" aria-labelledby="process">
        <div class="hero-orbit" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="intro-copy">
          <p class="eyebrow"><span class="eyebrow-spark" aria-hidden="true"></span>THE WORK, RECONSTRUCTED</p>
          <h1 id="process">Laptop procurement</h1>
          <p id="description">Open a case to trace a request through Teams and Outlook.</p>
        </div>
        <div class="briefing">
          <p class="period" id="period" hidden></p>
          <button id="start-tour" class="quiet" type="button" disabled>Walkthrough <span class="arrow" aria-hidden="true"></span></button>
          <div class="trace-controls" id="trace-controls" hidden>
            <div class="ink-trace" id="ink-trace" aria-hidden="true"></div>
            <button id="trace-toggle" class="quiet" type="button" aria-pressed="false">Pause motion</button>
          </div>
        </div>
      </section>
    </section>
    <p id="workspace-status" class="workspace-status" role="status" hidden></p>
    <p id="load-state" class="workspace-status" role="status">Loading cases.</p>
    <section id="case-lab" class="lab" aria-labelledby="lab-title" hidden>
      <div class="brief">
        <div>
          <h2 id="lab-title" class="sr-only">Casebook</h2>
          <p id="insight"></p>
        </div>
        <button id="copy-link" class="secondary" type="button">Copy case link</button>
        <span id="copy-status" class="sr-only" role="status"></span>
      </div>
      <div id="tour" class="tour" aria-label="Guided walkthrough" hidden>
        <div class="tour-copy"><p id="tour-count"></p><h3 id="tour-title"></h3><p id="tour-text"></p></div>
        <div class="tour-actions">
          <button id="tour-close" class="secondary" type="button">Exit walkthrough</button>
          <button id="tour-next" class="primary" type="button">Next <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
      <div id="desk" class="desk">
        <nav class="panel cases" aria-label="Workflow cases">
          <button id="register-toggle" type="button" class="register-toggle" aria-expanded="false" aria-controls="case-register">Choose a case</button>
          <div id="case-register">
          <div class="panel-title"><h3>Cases</h3><span id="case-count" aria-live="polite"></span></div>
          <label for="case-search" class="sr-only">Find a case</label>
          <input type="search" id="case-search" placeholder="Find a case">
          <div class="filters">
            <button id="gaps-only" class="quiet" type="button" aria-pressed="false">Evidence gaps</button>
            <button id="reset-filter" class="quiet" type="button" hidden>Clear filters</button>
          </div>
          <div id="case-list"></div>
          <details class="coverage">
            <summary>Filter by stage</summary>
            <div id="overview" class="overview" role="group" aria-label="Filter cases by stage"></div>
          </details>
          </div>
        </nav>
        <section class="panel timeline" aria-labelledby="case-title">
          <div class="panel-title">
            <div class="case-heading"><p class="case-heading-kicker">CASE IN FOCUS</p><h3 id="case-title" tabindex="-1"></h3></div>
            <div class="case-nav" role="group" aria-label="Browse cases">
              <button id="previous-case" type="button" aria-label="Previous case"><span class="arrow" aria-hidden="true"></span></button>
              <span id="case-position"></span>
              <button id="next-case" type="button" aria-label="Next case"><span class="arrow" aria-hidden="true"></span></button>
            </div>
          </div>
          <p class="panel-subtitle" id="case-context"></p>
          <div id="case-summary" class="case-summary" aria-live="polite"></div>
          <div id="case-replay"></div>
          <ol id="steps"></ol>
          <a class="jump-evidence" href="#evidence-title">View selected evidence <span class="arrow" aria-hidden="true"></span></a>
        </section>
        <section class="panel inspector" aria-labelledby="evidence-title">
          <div class="panel-title"><h3 id="evidence-title" tabindex="-1"></h3></div>
          <p class="panel-subtitle" id="evidence-context"></p>
          <p id="correction-status" role="status"></p>
          <div class="inspection-sheet">
            <div id="records"></div>
            <form id="review-form">
            <label for="review-note">Reviewer note</label>
            <textarea id="review-note" rows="2" maxlength="500" placeholder="Add context for this step"></textarea>
            <div class="actions">
              <button name="decision" class="secondary" value="confirmed">Confirm</button>
              <button name="decision" class="secondary" value="flagged">Flag for review</button>
              <button id="clear-review" class="quiet" type="button" hidden>Clear</button>
            </div>
            <p class="review-state" id="review-state" role="status"></p>
            <button id="next-review" class="quiet" type="button" hidden>Next step to check →</button>
            </form>
          </div>
        </section>
      </div>
    </section>
  </main>
  <footer><span class="footer-credit"><span class="footer-dot" aria-hidden="true"></span>Mission Control <span class="footer-separator">/</span> Every conclusion has a source.</span><span id="counts"></span></footer>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"><span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Dark mode</span></button>
</body>
</html>
